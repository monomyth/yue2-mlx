name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # MLX publishes a CPU backend for Linux, so the whole suite runs without a Mac. Anything
    # needing Metal, real weights, or real timings has to be run on Apple Silicon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install 'mlx[cpu]'
          pip install -e '.[dev]'
          pip install ruff

      - name: Lint
        run: ruff check yue2_mlx tests scripts

      - name: Format check
        run: ruff format --check yue2_mlx tests scripts

      - name: Tests
        run: pytest tests/ -q
